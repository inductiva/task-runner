services:
  task-runner-lite:
      build:
        context: .
        dockerfile: task-runner/Dockerfile.lite
      environment:
        EXECUTER_IMAGES_DIR: /executer-images
        API_URL: ${INDUCTIVA_API_URL}
        USER_API_KEY: ${INDUCTIVA_API_KEY}
        MACHINE_GROUP_NAME: ${MACHINE_GROUP_NAME}
        HOST_NAME: ${TASK_RUNNER_HOSTNAME:-${HOSTNAME}}
      volumes:
        - ./apptainer:/executer-images
        - workdir:/workdir
      network_mode: host
      extra_hosts:
        - "host.docker.internal:host-gateway"
      privileged: true
      platform: linux/amd64
  file-tracker:
    build:
      context: .
      dockerfile: file-tracker/Dockerfile
    environment:
      API_URL: ${INDUCTIVA_API_URL}
      USER_API_KEY: ${INDUCTIVA_API_KEY}
    network_mode: host
    volumes:
        - workdir:/workdir
  prometheus:
    image: prom/prometheus:latest
    network_mode: host
    user: "0:0"
    volumes:
        - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - prometheus_data:/prometheus
    command:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=15d
        - --web.console.libraries=/usr/share/prometheus/console_libraries
        - --web.console.templates=/usr/share/prometheus/consoles
  grafana:
    image: grafana/grafana:latest
    network_mode: host
    user: "0:0"
    environment:
        - GF_SECURITY_ADMIN_USER=admin
        - GF_SECURITY_ADMIN_PASSWORD=admin
        - GF_SERVER_HTTP_PORT=3500
    volumes:
        - grafana_data:/var/lib/grafana

volumes:
  workdir:
  prometheus_data:
  grafana_data:
