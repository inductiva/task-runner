global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "file-tracker"
    static_configs:
      - targets: ["localhost:9091"]
    metrics_path: "/metrics"

  - job_name: "task-runner-lite"
    static_configs:
      - targets: ["localhost:8000"]
    metrics_path: "/metrics"


